{

  "tech_nm": 7,

  "voltage": 0.7,

  "metalPrefix": "M",

  "manufacturing_grid_nm": 1,

  # Y pins are on 'left' and 'right' sides
  # X pins are on 'top' and 'bottom' sides
  "pinParams": {
    # set 36nm to x track pitch in met3
    "x_metLayerPin": 3,
    "x_pinPitch_nm": 36,
    "x_pinWidth_nm" : 18,  
    "x_pinHeight_nm": 36,
    "x_pinOffset_nm": 0,

    # set 48nm to y track pitch in met4
    "y_metLayerPin": 4,
    "y_pinPitch_nm": 48,
    "y_pinWidth_nm" : 24,
    "y_pinHeight_nm": 48,
    "y_pinOffset_nm": 0
  },

  # Power Grid
  "powerGridParams": {
      # "vertical" or "horizontal" strapes
      "directionPowerGrid": "horizontal",
      "metLayerPowerGrid": 4,
      
      # pinWidth * 4 = 96nm
      "powerGridWidth_nm": 96,

      # met4 x track pitch * 8 = 384nm 
      "powerGridPitch_nm": 384
  },

  # timing for all srams
  "timing": {
    "t_setup_ns": 0.050,
    "t_hold_ns": 0.050,
    "cap_input_pf": 0.005
  },

  "additionalParams": {
    # snap sram dimensions to track
    "heightSnapPinPitch": false,
    "widthSnapPinPitch": true,

    # column mux factor to all srams unless overriden
    "column_mux_factor": 4,
    "snapWidth_nm": 190,
    "snapHeight_nm": 1400
  },

  # uses custom_tech, defaults to false
  "use_custom_tech": true,

  # Custom tech parameters
  "custom_tech": {
    "access_time_ns": 0.2183,
    "cycle_time_ns": 0.2566,
    "fo4_ps": 9.0632,
    "standby_leakage_per_bank_mW": 0.1289,
    "pin_dynamic_power_mW": 0.0013449,

    "finPitch_nm": 27,
    "contacted_poly_pitch_nm": 54,
    
    # Needed tracks/poly for asap7 122 sram cell
    # 10 fin pitches
    "h0_tracks": 10,
    "w0_polys": 2,

    # Optional dummy height/width port overhead values
    "dh_read": 2,
    "dw_read": 0.5,
    "dh_write": 2.5,
    "dw_write": 0.5,
    "dh_rw": 1,
    "dw_rw": 0.5

  },

  # add 'fakeram.' infront of all names
  # for openroad flow scripts use:
  # export GDS_ALLOW_EMPTY=fakeram.*
  "add_fakeram_extension": true,

  # List of SRAM configurations (name width depth and banks)
  "srams": [ 
    
    # Basic single-port RW SRAM, medium size
    {"name": "testram7_1rw_32w1024d_sram", 
     "width": 32,
     "depth": 1024,
     "banks": 1,
     "column_mux_factor": 6,
     "write_mode": "write_first",
     "ports": {
     "r": 0,
     "w": 0,
     "rw": 1
     }
    },
    
    # Dual-port SRAM (1R+1W), small size with write granularity
    {"name": "testram7_1r1w_16w256d_8_sram", 
     "width": 16,
     "depth": 256,
     "banks": 1,
     "column_mux_factor": 4,
     "write_mode": "read_first",
     "write_granularity": 8,
     "ports": {
     "r": 1,
     "w": 1,
     "rw": 0
     }
    },
    
    # Mixed ports (1RW+1R), dual bank configuration
    {"name": "testram7_1rw1r_64w512d2b_sram", 
     "width": 64,
     "depth": 512,
     "banks": 2,
     "write_mode": "write_first",
     "ports": {
     "r": 1,
     "w": 0,
     "rw": 1
     }
    },
    
    # Write-only SRAM with fine-grain write capability
    {"name": "testram7_1w_48w1024d_4wm_sram", 
     "width": 48,
     "depth": 1024,
     "banks": 1,
     "column_mux_factor": 3,
     "write_mode": "write_first",
     "write_granularity": 4,
     "ports": {
     "r": 0,
     "w": 1,
     "rw": 0
     }
    },
    
    # Complex multi-port (2R+2W), large size, dual bank
    {"name": "testram7_2r2w_80w2048d2b_16wm_sram", 
     "width": 80,
     "depth": 2048,
     "banks": 2,
     "write_mode": "read_first",
     "column_mux_factor": 4,
     "write_granularity": 16,
     "ports": {
     "r": 2,
     "w": 2,
     "rw": 0
     }
    }
  ]
}