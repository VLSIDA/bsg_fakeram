     }
    },
    {"name": "testram_1r2w_48w1024d_8_sram", 
     "width": 48,
     "depth": 1024,
     "banks": 2,
     "pitchFactor": 7,
     "write_mode": "read_first",
     "write_granularity": 8,
     "ports": {
     "r": 1,
     "w": 2,
     "rw": 0
     }
    },
    {"name": "testram_2r2w_90w2048d_18_sram", 
     "width": 90,
     "depth": 2048,
     "banks": 2,
     "pitchFactor": 10,
     "write_mode": "read_first",
     "write_granularity": 18,
     "ports": {
     "r": 2,
     "w": 2,
     "rw": 0
     }
    }
  ]
}
