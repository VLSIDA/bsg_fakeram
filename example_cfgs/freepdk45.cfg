{
  # The process node. This is used to tell cacti what technology to use when
  # estimating power, performance and area numbers.
  "tech_nm": 45,

  # The operating voltage.
  "voltage": 1.1,

  # String to add in front of every metal layer number for the layer name.
  "metalPrefix": "metal",

  # The pin width for signal pins.
  "pinWidth_nm": 70,

  # The minimum pin pitch for signal pins.
  "pinPitch_nm": 140,

  # Defaults to pinPitch_nm
  # "x_pinPitch_nm": 140,

  # Optional, default false, recommended to use when
  # aligning horizontal pins to y tracks.
  # setting to true assumes pin pitches are on tracks
  "heightSnaptoTrack": true,

  # Optional, defaults to 0 
  # unless heightSnaptoTrack is true 
  "y_offset_nm": 0,

  # Optional, defaults to 0
  "x_offset_nm": 0,

  # Optional: snap the width and height of the sram to a multiple value.
  "snapWidth_nm":  190,
  "snapHeight_nm": 1400,

  # Manufacturing grid spacing for valid pin placement
  "manufacturing_grid_nm": 5,

  # Height divided by its column_mux_factor for all srams,
  # Column_mux_factor defaults to 1. Can be overriden for a specific
  # sram with parameter column_mux_factor_override in "sram". 
  "column_mux_factor": 1,

  # Needed values for lib generation / can be overriden
  # arbitrary 50ps setup
  "t_setup_ns": 0.050,
  
  # arbitrary 50ps hold 
  "t_hold_ns": 0.050,

  # cap input
  "cap_input_pf": 0.005,

  # Flips the pin orientations. Non-fliped assumes metal1 is vertical therefore
  # supply pins on metal4 will be horizontal and signal pins will also be on
  # metal4. If set to true, supply pins on metal4 will be vertical and signal
  # pins will be on metal3.
  "flipPins": true,

  # Vertical pins only, if true x_pinPitch is ignored, default false
  # read data pins on right, write data pins on left
  # used if violations reoccur, currently buggy, data pins might overlap, ensure with klayout
  "verticalPinsOnly": false,

  # Use custom tech
  "use_custom_tech": false,

  # Custom tech parameters
  "custom_tech": {
    "hybrid": false
  },

  # List of SRAM configurations (name width depth and banks)
  "srams": [ 
    {"name": "fakeram.testram_1rw_39w2048d_sram", 
     "width": 39,
     "depth": 2048,
     "banks": 2,
     "pitchFactor": 6,
     "write_mode": "write_first",
     "r": 0,
     "w": 0,
     "rw": 1
    },

    {"name": "fakeram.testram_1w_64w256d_16_sram", 
     "width": 64,
     "depth": 256,
     "banks": 1,
     "pitchFactor": 5,
     "column_mux_factor_override": 2,
     "write_mode": "write_first",
     "write_granularity": 16,
     "r": 0,
     "w": 1,
     "rw": 0
    },
    {"name": "fakeram.testram_2rw_32w1024d_sram", 
     "width": 32,
     "depth": 1024,
     "banks": 1,
     "pitchFactor": 3,
     "write_mode": "read_first",
     "r": 0,
     "w": 0,
     "rw": 2
    },
    {"name": "fakeram.testram_1r1w_8w64d_4_sram", 
     "width": 8,
     "depth": 64,
     "banks": 1,
     "pitchFactor": 1,
     "write_mode": "write_first",
     "write_granularity": 4,
     "r": 1,
     "w": 1,
     "rw": 0
    },
    {"name": "fakeram.testram_2r_24w512d_sram", 
     "width": 24,
     "depth": 512,
     "banks": 1,
     "pitchFactor": 3,
     "write_mode": "read_first",
     "r": 2,
     "w": 0,
     "rw": 0
    },
    {"name": "fakeram.testram_1r2w_48w1024d_8_sram", 
     "width": 48,
     "depth": 1024,
     "banks": 2,
     "pitchFactor": 7,
     "write_mode": "read_first",
     "write_granularity": 8,
     "r": 1,
     "w": 2,
     "rw": 0
    },
    {"name": "fakeram.testram_2r2w_90w2048d_18_sram", 
     "width": 90,
     "depth": 2048,
     "banks": 2,
     "pitchFactor": 10,
     "write_mode": "read_first",
     "write_granularity": 18,
     "r": 2,
     "w": 2,
     "rw": 0
    }
  ]
}
