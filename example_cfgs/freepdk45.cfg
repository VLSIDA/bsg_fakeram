{
  "tech_nm": 45,

  "voltage": 1.1,

  "metalPrefix": "metal",
  
  "manufacturing_grid_nm": 5,

  "metalLayerPins": {
    # metLayer data pins
    # metLayer addr, clk, ce, we (writes only)
    # maybe future we configure individual pins
    "metLayerHorizontalPin": 2,
    "metLayerVerticalPin": 3,

    "PowerGrid": {
      "metLayerPowerGrid": 4,

      # "vertical" or "horizonal" strapes
      "directionPowerGrid": "vertical"
    }
  },

  "pitchParams": {
    # "track", "pinpitch"
    "pinSnapMode": "pinpitch",
    
    # pins will round up to nearest track
    # accomodate finfets strict rules
    "track": {
      "x_trackPitch_nm": 190,
      "y_trackPitch_nm": 140
    },

    # pins will be by its pitch
    "pinpitch": {

      # horizontal pin to align met2 190nm x track pitch
      "x_pinPitch_nm": 190,

      # vertical pin to align met3 140 nm y track pitch
      "y_pinPitch_nm": 140
    },

    # track/pitch + offset
    "x_pinOffset_nm": 0,
    "y_pinOffset_nm": 0
  },

  "pinDimensions": {
    "pinWidth_nm": 70,
    "pinHeight_nm": 70
  },

  # timing for all srams
  "timing": {
    "t_setup_ns": 0.050,
    "t_hold_ns": 0.050,
    "cap_input_pf": 0.005
  },

  "additionalParams": {
    # snap sram dimensions to track (reccomended)
    # y offset ignored
    "heightSnaptoTrack": true,

    # x offset ignored
    "widthSnaptoTrack": true,

    # pins will be equidistant throughout all
    # sides based on snap mode, pitch factor is ignored
    # TODO:
    # "equidistantPins": false,

    # all pins will be placed on left/right sides of sram
    "verticalPinsOnly": false,

    # column mux factor to all srams unless overriden
    "column_mux_factor": 1,
    "snapWidth_nm": 190,
    "snapHeight_nm": 1400
  },

  "use_custom_tech": false,
  # Custom tech parameters
  "custom_tech": {
    "hybrid": false
  },


  # List of SRAM configurations (name width depth and banks)
  "srams": [ 
    {"name": "testram_1rw_39w2048d_sram", 
     "width": 39,
     "depth": 2048,
     "banks": 2,
     "pitchFactor": 6,
     "write_mode": "write_first",
     "ports": {
     "r": 0,
     "w": 0,
     "rw": 1
     }
    },

    {"name": "testram_1w_64w256d_16_sram", 
     "width": 64,
     "depth": 256,
     "banks": 1,
     "pitchFactor": 5,
     "column_mux_factor_override": 2,
     "write_mode": "write_first",
     "write_granularity": 16,
     "ports": {
     "r": 0,
     "w": 1,
     "rw": 0
     }
    },
    {"name": "testram_2rw_32w1024d_sram", 
     "width": 32,
     "depth": 1024,
     "banks": 1,
     "pitchFactor": 3,
     "write_mode": "read_first",
     "ports": {
     "r": 0,
     "w": 0,
     "rw": 2
     }
    },
    {"name": "testram_1r1w_8w64d_4_sram", 
     "width": 8,
     "depth": 64,
     "banks": 1,
     "pitchFactor": 1,
     "write_mode": "write_first",
     "write_granularity": 4,
     "ports": {
     "r": 1,
     "w": 1,
     "rw": 0
     }
    },
    {"name": "testram_2r_24w512d_sram", 
     "width": 24,
     "depth": 512,
