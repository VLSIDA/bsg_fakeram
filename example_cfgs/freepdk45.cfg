{
  "tech_nm": 45,

  "voltage": 1.1,

  "metalPrefix": "metal",
  
  "manufacturing_grid_nm": 5,

# Y pins are on 'left' and 'right' sides
# X pins are on 'top' and 'bottom' sides
  "pinParams": {
    # vertical pin to align met3 140 nm y track pitch
    "y_metLayerPin": 3,
    "y_pinPitch_nm": 140,
    "y_pinWidth_nm": 70,
    "y_pinHeight_nm": 70,
    "y_pinOffset_nm": 0,

    # horizontal pin to align met2 190nm x track pitch
    "x_metLayerPin": 2,
    "x_pinPitch_nm": 190,
    "x_pinWidth_nm": 70,
    "x_pinHeight_nm": 70,
    "x_pinOffset_nm": 0
  },

  # Power Grid
  "powerGridParams": {
    # "vertical" or "horizontal" strapes
    "directionPowerGrid": "vertical",
    "metLayerPowerGrid": 4,
    
    # pinWidth * 4 = 280nm
    "powerGridWidth_nm": 280,

    # met4 x track pitch * 8 = 1520nm
    "powerGridPitch_nm": 1520
  },

  # timing for all srams
  "timing": {
    "t_setup_ns": 0.050,
    "t_hold_ns": 0.050,
    "cap_input_pf": 0.005
  },

  "additionalParams": {
    # snap sram dimensions to track (reccomended)
    # y offset ignored
    "heightSnapPinPitch": true,

    # x offset ignored
    "widthSnapPinPitch": true,

    # column mux factor to all srams unless overriden
    "snapWidth_nm": 190,
    "snapHeight_nm": 1400
  },

  # add 'fakeram.' infront of all names
  # for openroad flow scripts use:
  # export GDS_ALLOW_EMPTY=fakeram.*
  "add_fakeram_extension": true,

  # List of SRAM configurations (name width depth and banks)
  "srams": [ 
    # Basic single-port RW SRAM, medium size
    {"name": "testram45_1rw_32w1024d_sram", 
     "width": 32,
     "depth": 1024,
     "banks": 1,
     "write_mode": "write_first",
     "ports": {
     "r": 0,
     "w": 0,
     "rw": 1
     }
    },
    
    # Dual-port SRAM (1R+1W), small size with write granularity
    {"name": "testram45_1r1w_16w256d_8_sram", 
     "width": 16,
     "depth": 256,
     "banks": 1,
     "write_mode": "read_first",
     "write_granularity": 8,
     "ports": {
     "r": 1,
     "w": 1,
     "rw": 0
     }
    },
    
    # Mixed ports (1RW+1R), dual bank configuration
    {"name": "testram45_1rw1r_64w512d2b_sram", 
     "width": 64,
     "depth": 512,
     "banks": 2,
     "write_mode": "write_first",
     "ports": {
     "r": 1,
     "w": 0,
     "rw": 1
     }
    },
    
    # Write-only SRAM with fine-grain write capability
    {"name": "testram45_1w_48w1024d_4wm_sram", 
     "width": 48,
     "depth": 1024,
     "banks": 1,
     "write_mode": "write_first",
     "write_granularity": 4,
     "ports": {
     "r": 0,
     "w": 1,
     "rw": 0
     }
    },

    # Mixed Multi port (2W + 2RW) with large write granularity,
    {"name": "testram45_2w2rw_128d2048w_16wm_sram", 
     "width": 128,
     "depth": 2048,
     "banks": 2,
     "write_mode": "write_first",
     "write_granularity": 16,
     "ports": {
     "r": 0,
     "w": 2,
     "rw": 2
     }
    },
    
    # Complex multi-port (2R+2W), large size, dual bank
    {"name": "testram45_2r2w_80w2048d2b_16wm_sram", 
     "width": 80,
     "depth": 2048,
     "banks": 2,
     "write_mode": "read_first",
     "write_granularity": 16,
     "ports": {
     "r": 2,
     "w": 2,
     "rw": 0
     }
    }
  ]
}