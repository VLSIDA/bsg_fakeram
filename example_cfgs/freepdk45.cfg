{
  "tech_nm": 45,

  "voltage": 1.1,

  "metalPrefix": "metal",
  
  "manufacturing_grid_nm": 5,

  "pinParams": {
    "metLayerHorizontalPin": 2,
    "metLayerVerticalPin": 3,

    # horizontal pin to align met2 190nm x track pitch
    "x_pinPitch_nm": 190,
    # vertical pin to align met3 140 nm y track pitch
    "y_pinPitch_nm": 140,

    # pitch + offset
    "x_pinOffset_nm": 0,
    "y_pinOffset_nm": 0,
    "pinWidth_nm": 70,
    "pinHeight_nm": 70
  },

  "powerGridParams": {
    # "vertical" or "horizonal" strapes
    "directionPowerGrid": "vertical",
    "metLayerPowerGrid": 4,
    
    # pinWidth * 4 = 280nm
    "powerGridWidth_nm": 280,

    # met4 x track pitch * 8 = 1520nm
    "powerGridPitch_nm": 1520
  },

  # timing for all srams
  "timing": {
    "t_setup_ns": 0.050,
    "t_hold_ns": 0.050,
    "cap_input_pf": 0.005
  },

  "additionalParams": {
    # snap sram dimensions to track (reccomended)
    # y offset ignored
    "heightSnapPinPitch": true,

    # x offset ignored
    "widthSnapPinPitch": true,

    # all pins will be placed on left/right sides of sram
    "verticalPinsOnly": false,

    # column mux factor to all srams unless overriden
    "column_mux_factor": 1,
    "snapWidth_nm": 190,
    "snapHeight_nm": 1400
  },

  "use_custom_tech": false,
