{
  "tech_nm": 130,

  "voltage": 1.8,

  "metalPrefix": "met",
  
  "manufacturing_grid_nm": 5,

# Y pins are on 'left' and 'right' sides
# X pins are on 'top' and 'bottom' sides
  "pinParams": {
    # horizontal pin to align met2 460nm x track pitch
    "x_metLayerPin": 2,
    "x_pinPitch_nm": 460,
    "x_pinWidth_nm": 300,
    "x_pinHeight_nm": 800,
    "x_pinOffset_nm": 0,

    # vertical pin to align met3 680 nm y track pitch
    "y_metLayerPin": 3,
    "y_pinPitch_nm": 680,
    "y_pinWidth_nm": 300,
    "y_pinHeight_nm": 800,
    "y_pinOffset_nm": 0
  },

  # Power Grid
  "powerGridParams": {
      "metLayerPowerGrid": 4,
      # "vertical" or "horizontal" strapes
      "directionPowerGrid": "vertical",

      # pinWidth * 4 = 1200nm
      "powerGridWidth_nm": 1200,

      # x track pitch = 920nm
      # met4 x track pitch * 8 = 7360nm
      "powerGridPitch_nm": 7360,

      # offset by depends on direction of powergrid
      # met4 x track offset
      "powerGridOffset_nm": 0 
  },

  # timing for all srams
  "timing": {
    "t_setup_ns": 0.050,
    "t_hold_ns": 0.050,
    "cap_input_pf": 0.005
  },

  "additionalParams": {
    # snap sram dimensions to track (reccomended)
    # y offset ignored
    "heightSnapPinPitch": true,

    # x offset ignored
    "widthSnapPinPitch": true,

    # all pins will be placed on left/right sides of sram
    "verticalPinsOnly": false,

    # column mux factor to all srams unless overriden
    "column_mux_factor": 1,
    "snapWidth_nm": 460,
    "snapHeight_nm": 2720
  },

  # add 'fakeram.' infront of all names
  # for openroad flow scripts use:
  # export GDS_ALLOW_EMPTY=fakeram.*
  "add_fakeram_extension": true,

  # List of SRAM configurations (name width depth and banks)
  "srams": [ 
    # Basic single-port RW SRAM, medium size
    {"name": "testram130_1rw_32w1024d_sram", 
     "width": 32,
     "depth": 1024,
     "banks": 1,
     "write_mode": "write_first",
     "ports": {
     "r": 0,
     "w": 0,
     "rw": 1
     }
    },

    {
      "name": "sky130_sram_1kbyte_1rw1r_8x1024_8",
      "width": 8,
      "depth": 1024,
      "banks": 1,
      "write_mode": "write_first",
      "ports": {
        "r": 1,
        "w": 0,
        "rw": 1
      }
    },
    
    # Dual-port SRAM (1R+1W), small size with write granularity
    {"name": "testram130_1r1w_16w256d_8_sram", 
     "width": 16,
     "depth": 256,
     "banks": 1,
     "write_mode": "read_first",
     "write_granularity": 8,
     "ports": {
     "r": 1,
     "w": 1,
     "rw": 0
     }
    },
    
    # Mixed ports (1RW+1R), dual bank configuration
    {"name": "testram130_1rw1r_64w512d2b_sram", 
     "width": 64,
     "depth": 512,
     "banks": 2,
     "write_mode": "write_first",
     "ports": {
     "r": 1,
     "w": 0,
     "rw": 1
     }
    },
    
    # Write-only SRAM with fine-grain write capability
    {"name": "testram130_1w_48w1024d_4wm_sram", 
     "width": 48,
     "depth": 1024,
     "banks": 1,
     "write_mode": "write_first",
     "write_granularity": 4,
     "ports": {
     "r": 0,
     "w": 1,
     "rw": 0
     }
    },

    # Mixed Multi port (2W + 2RW) with large write granularity,
    {"name": "testram130_2w2rw_128d2048w_16wm_sram", 
     "width": 128,
     "depth": 2048,
     "banks": 1,
     "write_mode": "write_first",
     "write_granularity": 16,
     "ports": {
     "r": 0,
     "w": 2,
     "rw": 2
     }
    },
    
    # Complex multi-port (2R+2W), large size, dual bank
    {"name": "testram130_2r2w_80w2048d2b_16wm_sram", 
     "width": 80,
     "depth": 2048,
     "banks": 2,
     "write_mode": "read_first",
     "write_granularity": 16,
     "ports": {
     "r": 2,
     "w": 2,
     "rw": 0
     }
    }
  ]
}
